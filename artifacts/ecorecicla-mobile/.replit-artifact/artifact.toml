kind = "mobile"
previewPath = "/mobile/"
title = "EcoRecicla Mobile"
version = "1.0.0"
id = "artifacts/ecorecicla-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 22139

[services.development]
run = "pnpm --filter @workspace/ecorecicla-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ecorecicla-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ecorecicla-mobile", "run", "serve" ]

[services.env]
PORT = "22139"
BASE_PATH = "/mobile/"
