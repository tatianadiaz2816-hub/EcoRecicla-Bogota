  <!-- Nervaduras laterales -->
  <line x1="90" y1="100" x2="68" y2="84" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="90" y1="116" x2="72" y2="104" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="112" y2="84" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="90" y1="116" x2="108" y2="104" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
</svg>
